<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ماجراجویی سه‌بعدی تینی</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:Tahoma,Arial,sans-serif;touch-action:none}
#c{display:block;width:100%;height:100%}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;color:#fff;background:rgba(5,5,20,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:10;transition:opacity .5s,transform .5s}
.ov.hide{opacity:0;pointer-events:none;transform:scale(1.05)}
h1{font-size:clamp(28px,7.5vw,54px);background:linear-gradient(180deg,#FFF8E1,#FFD700,#FF8C00);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:14px;filter:drop-shadow(0 0 30px rgba(255,180,0,.6))}
h2{font-size:clamp(20px,5vw,34px);color:#FFD700;margin-bottom:14px;text-shadow:0 0 20px rgba(255,200,0,.5)}
p{font-size:clamp(14px,3.6vw,19px);line-height:1.9;max-width:620px;margin-bottom:22px;color:#e8e8e8}
button{background:linear-gradient(180deg,#FFD700,#FF8C00);color:#2b1a00;border:none;padding:15px 44px;border-radius:999px;font-family:inherit;font-weight:bold;font-size:clamp(16px,4vw,21px);cursor:pointer;box-shadow:0 8px 30px rgba(255,180,0,.5);transition:transform .12s;margin:6px}
button:active{transform:scale(.94)}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;padding:16px;display:flex;justify-content:space-between;align-items:flex-start;color:#fff}
#hearts{display:flex;gap:5px;font-size:clamp(22px,5vw,28px);filter:drop-shadow(0 2px 8px #000)}
#stats{background:rgba(0,0,0,.45);padding:10px 18px;border-radius:14px;font-size:clamp(14px,3.5vw,17px);line-height:1.7;backdrop-filter:blur(8px);text-shadow:0 2px 6px #000}
#lvlName{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);padding:9px 22px;border-radius:999px;font-size:clamp(13px,3.3vw,16px);color:#FFD700;z-index:5;pointer-events:none;backdrop-filter:blur(8px);border:1px solid rgba(255,215,0,.3)}
#stick{position:fixed;bottom:34px;right:34px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle at center,rgba(255,255,255,.12),rgba(255,255,255,.05));border:2px solid rgba(255,255,255,.28);z-index:20;touch-action:none;display:none;backdrop-filter:blur(8px)}
#knob{position:absolute;top:50%;left:50%;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.85),rgba(255,255,255,.4));transform:translate(-50%,-50%);box-shadow:0 4px 16px rgba(0,0,0,.5);transition:transform .05s}
#jumpBtn{position:fixed;bottom:54px;left:30px;width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,220,80,.7),rgba(255,120,0,.5));border:2px solid rgba(255,215,0,.8);color:#fff;font-size:40px;font-weight:bold;z-index:20;display:none;text-shadow:0 2px 10px #000;backdrop-filter:blur(8px);padding:0}
@media(pointer:coarse){#stick,#jumpBtn{display:flex;align-items:center;justify-content:center}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="hearts">❤️❤️❤️</div>
  <div id="stats">
    <div>🥕 <span id="carrotCount">0</span> / <span id="carrotMax">0</span></div>
    <div>⭐ <span id="scoreVal">0</span></div>
  </div>
</div>
<div id="lvlName"></div>

<div id="stick"><div id="knob"></div></div>
<button id="jumpBtn">⤒</button>

<div id="menu" class="ov">
  <h1>ماجراجویی سه‌بعدی تینی</h1>
  <p>🥕 هویج طلایی دزدیده شده! به قلعهٔ مونتانا مکس سفر کن، از ۵ سرزمین بگذر و آن را پس بگیر.</p>
  <button id="startBtn">▶ شروع بازی</button>
</div>

<div id="story" class="ov hide">
  <h2 id="storyTitle"></h2>
  <p id="storyText"></p>
  <button id="storyBtn">ادامه</button>
</div>

<div id="complete" class="ov hide">
  <h2 id="compTitle"></h2>
  <p id="compText"></p>
  <button id="compBtn">مرحله بعد</button>
</div>

<div id="over" class="ov hide">
  <h2 style="color:#ff3355">باختی...</h2>
  <p>اما تینی هرگز تسلیم نمی‌شود!</p>
  <button id="overBtn">تلاش دوباره</button>
</div>

<div id="win" class="ov hide">
  <h1>🎉 پیروزی! 🎉</h1>
  <p>هویج طلایی بازگشت و نوروز نجات یافت!</p>
  <button id="winBtn">بازگشت به منو</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

/* ============ RENDERER ============ */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(58, 1, 0.1, 500);

function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(w, h, false);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
addEventListener('orientationchange', ()=>setTimeout(resize, 250));
resize();

/* ============ SKY ============ */
const skyUniforms = {
  top: { value: new THREE.Color(0x87CEEB) },
  bot: { value: new THREE.Color(0xFFF8DC) }
};
const skyGeo = new THREE.SphereGeometry(300, 32, 16);
const skyMat = new THREE.ShaderMaterial({
  uniforms: skyUniforms,
  vertexShader: 'varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader: 'varying vec3 vP; uniform vec3 top; uniform vec3 bot; void main(){ float h=normalize(vP).y; gl_FragColor=vec4(mix(bot,top,smoothstep(-0.15,0.55,h)),1.0);}',
  side: THREE.BackSide,
  depthWrite: false
});
scene.add(new THREE.Mesh(skyGeo, skyMat));

/* ============ LIGHTS ============ */
const sun = new THREE.DirectionalLight(0xfff2cc, 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -45;
sun.shadow.camera.right = 45;
sun.shadow.camera.top = 45;
sun.shadow.camera.bottom = -45;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 120;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
scene.add(sun);
scene.add(sun.target);

const hemi = new THREE.HemisphereLight(0x87CEEB, 0x4a3a1a, 0.85);
scene.add(hemi);

const amb = new THREE.AmbientLight(0xffffff, 0.2);
scene.add(amb);

/* ============ RABBIT ============ */
function createRabbit(){
  const g = new THREE.Group();
  const white = new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.65, metalness:0.02});
  const pink = new THREE.MeshStandardMaterial({color:0xFFB6C1, roughness:0.7});
  const black = new THREE.MeshStandardMaterial({color:0x0a0a0a, roughness:0.3});
  const eyeWhite = new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.2, emissive:0x222222});
  const shine = new THREE.MeshStandardMaterial({color:0xffffff, emissive:0xffffff, emissiveIntensity:0.6});
  
  // body
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.62, 24, 18), white);
  body.scale.set(0.95, 1.1, 0.88);
  body.position.y = 0.75;
  body.castShadow = true; body.receiveShadow = true;
  g.add(body);
  
  // head
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.5, 24, 18), white);
  head.position.y = 1.65;
  head.castShadow = true;
  g.add(head);
  
  // ears
  const ears = [];
  for (const sx of [-1, 1]){
    const ear = new THREE.Mesh(new THREE.CapsuleGeometry(0.11, 0.55, 6, 12), white);
    ear.position.set(sx*0.2, 2.25, -0.02);
    ear.rotation.z = sx*0.12;
    ear.castShadow = true;
    g.add(ear);
    const inner = new THREE.Mesh(new THREE.CapsuleGeometry(0.06, 0.4, 4, 8), pink);
    inner.position.set(sx*0.2, 2.25, 0.09);
    inner.rotation.z = sx*0.12;
    g.add(inner);
    ears.push(ear);
  }
  
  // eyes (whites + pupils)
  for (const sx of [-1, 1]){
    const w = new THREE.Mesh(new THREE.SphereGeometry(0.1, 12, 10), eyeWhite);
    w.position.set(sx*0.19, 1.72, 0.42);
    g.add(w);
    const p = new THREE.Mesh(new THREE.SphereGeometry(0.07, 12, 10), black);
    p.position.set(sx*0.19, 1.72, 0.49);
    g.add(p);
    const s = new THREE.Mesh(new THREE.SphereGeometry(0.025, 6, 6), shine);
    s.position.set(sx*0.19-0.03, 1.76, 0.53);
    g.add(s);
  }
  
  // nose
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.075, 10, 8), pink);
  nose.position.set(0, 1.56, 0.5);
  g.add(nose);
  
  // cheeks
  for (const sx of [-1, 1]){
    const c = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 6), pink);
    c.scale.set(1.1, 0.6, 0.3);
    c.position.set(sx*0.32, 1.55, 0.38);
    c.material = new THREE.MeshStandardMaterial({color:0xff8fa3, roughness:0.8, transparent:true, opacity:0.55});
    g.add(c);
  }
  
  // arms
  const arms = [];
  for (const sx of [-1, 1]){
    const a = new THREE.Mesh(new THREE.CapsuleGeometry(0.09, 0.3, 4, 8), white);
    a.position.set(sx*0.55, 1.05, 0);
    a.rotation.z = sx*0.4;
    a.castShadow = true;
    g.add(a);
    arms.push(a);
  }
  
  // feet
  const feet = [];
  for (const sx of [-1, 1]){
    const f = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 10), white);
    f.scale.set(1.25, 0.55, 1.5);
    f.position.set(sx*0.3, 0.12, 0.14);
    f.castShadow = true; f.receiveShadow = true;
    g.add(f);
    feet.push(f);
  }
  
  // tail
  const tail = new THREE.Mesh(new THREE.SphereGeometry(0.18, 10, 8), white);
  tail.position.set(0, 0.75, -0.6);
  tail.castShadow = true;
  g.add(tail);
  
  g.userData = {ears, arms, feet, body, head, tail};
  return g;
}

const rabbit = createRabbit();
scene.add(rabbit);

/* ============ LEVELS ============ */
const LEVELS = [
  {name:'جنگل جادویی', sky:[0x87CEEB,0xFFF8DC], ground:0x7CB342, plat:0x8B5A2B, platTop:0x9CCC65, fog:0xa8d8a8, fogD:80,
   plats:[[0,0,0,10,10],[10,1,0,4,4],[16,2,3,4,4],[22,1,-2,4,4],[28,3,0,6,6],[36,4,2,4,4],[42,5,-2,4,4],[48,4,0,6,6],[56,6,0,4,4],[62,5,3,4,4],[68,7,0,4,4],[76,6,-2,4,4],[82,8,0,6,6],[90,8,0,8,8]],
   enemies:[[30,4.3,0,40,4.3,0],[50,5.3,0,60,5.3,0]],
   carrots:[[10,2.5,0],[16,3.5,3],[22,2.5,-2],[28,4.5,0],[36,5.5,2],[42,6.5,-2],[48,5.5,0],[56,7.5,0],[62,6.5,3],[68,8.5,0],[76,7.5,-2],[82,9.5,0],[90,9.5,0]],
   goal:[90,9,0]},
  {name:'غارهای تاریک', sky:[0x1a1a2e,0x2F4F4F], ground:0x4A148C, plat:0x311B92, platTop:0x7E57C2, fog:0x1a0a2e, fogD:50,
   plats:[[0,0,0,10,10],[10,1,-3,4,4],[16,2,2,4,4],[22,3,-3,4,4],[28,4,2,6,6],[36,5,-2,4,4],[42,6,3,4,4],[48,5,0,6,6],[56,7,0,4,4],[62,8,-3,4,4],[68,7,2,4,4],[76,8,-2,4,4],[82,9,0,6,6],[90,9,0,8,8]],
   enemies:[[30,5.3,2,40,5.3,2],[50,6.3,0,60,6.3,0]],
   carrots:[[10,2.5,-3],[16,3.5,2],[22,4.5,-3],[28,5.5,2],[36,6.5,-2],[42,7.5,3],[48,6.5,0],[56,8.5,0],[62,9.5,-3],[68,8.5,2],[76,9.5,-2],[82,10.5,0],[90,10.5,0]],
   goal:[90,10,0]},
  {name:'دشت یخی', sky:[0xB3E5FC,0xFFFFFF], ground:0x81D4FA, plat:0x90A4AE, platTop:0xE1F5FE, fog:0xd0f0ff, fogD:90,
   plats:[[0,0,0,10,10],[10,1,0,4,4],[16,2,3,4,4],[22,3,-3,4,4],[28,4,0,6,6],[36,5,3,4,4],[42,6,-3,4,4],[48,5,0,6,6],[56,7,3,4,4],[62,8,-3,4,4],[68,9,0,4,4],[76,10,3,4,4],[82,11,-2,4,4],[90,11,0,8,8]],
   enemies:[[30,5.3,0,40,5.3,0],[50,6.3,0,60,6.3,0]],
   carrots:[[10,2.5,0],[16,3.5,3],[22,4.5,-3],[28,5.5,0],[36,6.5,3],[42,7.5,-3],[48,6.5,0],[56,8.5,3],[62,9.5,-3],[68,10.5,0],[76,11.5,3],[82,12.5,-2],[90,12.5,0]],
   goal:[90,12,0]},
  {name:'آسمان ابری', sky:[0xFFB74D,0xFFCC80], ground:0xFFE0B2, plat:0xFFFFFF, platTop:0xFFF3E0, fog:0xffd9a0, fogD:100,
   plats:[[0,0,0,10,10],[10,1,0,4,4],[16,3,3,4,4],[22,5,-3,4,4],[28,7,0,6,6],[36,9,2,4,4],[42,11,-2,4,4],[48,9,0,6,6],[56,11,3,4,4],[62,13,-3,4,4],[68,15,0,4,4],[76,17,2,4,4],[82,15,-3,4,4],[90,15,0,8,8]],
   enemies:[[30,8.3,0,40,8.3,0],[50,10.3,0,60,10.3,0]],
   carrots:[[10,2.5,0],[16,4.5,3],[22,6.5,-3],[28,8.5,0],[36,10.5,2],[42,12.5,-2],[48,10.5,0],[56,12.5,3],[62,14.5,-3],[68,16.5,0],[76,18.5,2],[82,16.5,-3],[90,16.5,0]],
   goal:[90,16,0]},
  {name:'قلعهٔ مونتانا', sky:[0x4A0000,0x1a0000], ground:0x37474F, plat:0x212121, platTop:0x546E7A, fog:0x2a0000, fogD:60,
   plats:[[0,0,0,10,10],[10,1,-2,4,4],[16,2,2,4,4],[22,3,-2,4,4],[28,4,2,6,6],[36,5,-2,4,4],[42,6,2,4,4],[48,7,-2,6,6],[56,8,0,4,4],[62,9,2,4,4],[68,10,-2,4,4],[76,11,0,4,4],[82,12,0,6,6],[90,12,0,10,10]],
   enemies:[[30,5.3,2,40,5.3,2],[50,8.3,-2,60,8.3,-2],[70,11.3,2,80,11.3,2]],
   carrots:[[10,2.5,-2],[16,3.5,2],[22,4.5,-2],[28,5.5,2],[36,6.5,-2],[42,7.5,2],[48,8.5,-2],[56,9.5,0],[62,10.5,2],[68,11.5,-2],[76,12.5,0],[82,13.5,0],[90,13.5,0]],
   goal:[90,13,0], boss:true}
];

/* ============ WORLD BUILD ============ */
let world = new THREE.Group();
scene.add(world);
let boxes = [];
let enemies = [];
let carrotMeshes = [];
let goalMesh = null;
let boss = null;
let carrotsMax = 0;

const carrotMat = new THREE.MeshStandardMaterial({color:0xFF8C00, roughness:0.6, emissive:0xFF6600, emissiveIntensity:0.35});
const carrotLeafMat = new THREE.MeshStandardMaterial({color:0x4CAF50, roughness:0.8});
const enemyMat = new THREE.MeshStandardMaterial({color:0xE53935, roughness:0.5, emissive:0x660000, emissiveIntensity:0.3});
const enemyEyeMat = new THREE.MeshStandardMaterial({color:0xffffff, emissive:0xffffff, emissiveIntensity:0.3});
const enemyPupilMat = new THREE.MeshStandardMaterial({color:0x000000});
const bossMat = new THREE.MeshStandardMaterial({color:0x4A148C, roughness:0.5, emissive:0x2a0050, emissiveIntensity:0.4});

function buildLevel(idx){
  // clear
  while (world.children.length) world.remove(world.children[0]);
  boxes = []; enemies = []; carrotMeshes = []; goalMesh = null; boss = null;
  
  const L = LEVELS[idx];
  skyUniforms.top.value.setHex(L.sky[0]);
  skyUniforms.bot.value.setHex(L.sky[1]);
  scene.fog = new THREE.Fog(L.fog, 20, L.fogD);
  sun.color.setHex(0xfff2cc);
  
  // platforms
  for (const [x, y, z, w, d] of L.plats){
    // base
    const geo = new THREE.BoxGeometry(w, 1, d);
    const mat = new THREE.MeshStandardMaterial({color:L.plat, roughness:0.9, metalness:0.05});
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, y - 0.5, z);
    m.castShadow = true; m.receiveShadow = true;
    world.add(m);
    
    // grass / top
    const topGeo = new THREE.BoxGeometry(w + 0.1, 0.15, d + 0.1);
    const topMat = new THREE.MeshStandardMaterial({color:L.platTop, roughness:0.75});
    const top = new THREE.Mesh(topGeo, topMat);
    top.position.set(x, y + 0.05, z);
    top.receiveShadow = true;
    world.add(top);
    
    boxes.push({x: x - w/2, y: y - 1, z: z - d/2, w: w, h: 1, d: d});
  }
  
  // enemies (patrol)
  for (const [x1, y1, z1, x2, y2, z2] of L.enemies){
    const e = new THREE.Group();
    const body = new THREE.Mesh(new THREE.SphereGeometry(0.55, 20, 14), enemyMat);
    body.castShadow = true;
    e.add(body);
    const eyeW = new THREE.Mesh(new THREE.SphereGeometry(0.14, 10, 8), enemyEyeMat);
    eyeW.position.set(-0.18, 0.1, 0.45);
    e.add(eyeW);
    const eyeW2 = eyeW.clone(); eyeW2.position.x = 0.18; e.add(eyeW2);
    const pup = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 6), enemyPupilMat);
    pup.position.set(-0.18, 0.1, 0.52); e.add(pup);
    const pup2 = pup.clone(); pup2.position.x = 0.18; e.add(pup2);
    e.position.set(x1, y1 + 0.6, z1);
    e.userData = {
      a: new THREE.Vector3(x1, y1 + 0.6, z1),
      b: new THREE.Vector3(x2, y2 + 0.6, z2),
      t: Math.random(), speed: 0.35, alive: true, type:'patrol'
    };
    world.add(e);
    enemies.push(e);
  }
  
  // boss (in last level)
  if (L.boss){
    const b = new THREE.Group();
    const bb = new THREE.Mesh(new THREE.SphereGeometry(1.2, 24, 18), bossMat);
    bb.castShadow = true;
    b.add(bb);
    // horns
    for (const sx of [-1, 1]){
      const h = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.8, 8), new THREE.MeshStandardMaterial({color:0x1a001a}));
      h.position.set(sx*0.4, 1.2, 0); h.rotation.z = sx*0.3;
      h.castShadow = true;
      b.add(h);
    }
    // eyes
    for (const sx of [-1, 1]){
      const ey = new THREE.Mesh(new THREE.SphereGeometry(0.24, 14, 10), new THREE.MeshStandardMaterial({color:0xff0033, emissive:0xff0033, emissiveIntensity:2}));
      ey.position.set(sx*0.42, 0.2, 1.05);
      b.add(ey);
    }
    // mouth
    const mouth = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.15, 0.2), new THREE.MeshStandardMaterial({color:0x000000}));
    mouth.position.set(0, -0.45, 1.1);
    b.add(mouth);
    b.position.set(85, 14, 0);
    b.userData = {
      hp: 8, maxHp: 8, alive: true, t: 0, phase: 1,
      cx: 85, cz: 0, radius: 6, angle: 0, shootT: 120, hurt: 0
    };
    world.add(b);
    boss = b;
    // boss projectiles
    boss.userData.projectiles = [];
  }
  
  // carrots
  for (const [x, y, z] of L.carrots){
    const c = new THREE.Group();
    const body = new THREE.Mesh(new THREE.ConeGeometry(0.28, 0.65, 10), carrotMat);
    body.rotation.x = Math.PI;
    body.castShadow = true;
    c.add(body);
    const leaf = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.32, 6), carrotLeafMat);
    leaf.position.y = 0.4;
    c.add(leaf);
    c.position.set(x, y + 0.8, z);
    c.userData = { baseY: y + 0.8, got: false, t: Math.random()*10 };
    world.add(c);
    carrotMeshes.push(c);
  }
  carrotsMax = L.carrots.length;
  document.getElementById('carrotMax').textContent = carrotsMax;
  
  // goal portal
  const goalG = new THREE.Group();
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(1.2, 0.22, 12, 32),
    new THREE.MeshStandardMaterial({color:0xFFD700, emissive:0xFFD700, emissiveIntensity:0.7, roughness:0.3, metalness:0.5})
  );
  goalG.add(ring);
  const disc = new THREE.Mesh(
    new THREE.CircleGeometry(1.1, 24),
    new THREE.MeshBasicMaterial({color:0xFFFF88, transparent:true, opacity:0.5, side:THREE.DoubleSide})
  );
  goalG.add(disc);
  const gl = new THREE.PointLight(0xFFD700, 3, 15);
  goalG.add(gl);
  const [gx, gy, gz] = L.goal;
  goalG.position.set(gx, gy + 2, gz);
  goalG.userData = { ring, disc, t:0, baseY: gy + 2 };
  world.add(goalG);
  goalMesh = goalG;
  
  document.getElementById('lvlName').textContent = 'مرحله ' + (idx+1) + ' — ' + L.name;
}

/* ============ PLAYER PHYSICS ============ */
const player = {
  pos: new THREE.Vector3(0, 0.5, 0),
  vel: new THREE.Vector3(),
  onGround: false,
  coyote: 0,
  jumpBuf: 0,
  facing: 0,
  hp: 3,
  maxHp: 3,
  carrots: 0,
  score: 0,
  invuln: 0,
  dead: false,
  deathT: 0,
  runPhase: 0,
  squash: 1,
  stretch: 1,
  doubleJump: true
};
const PLAYER_W = 0.75, PLAYER_H = 1.9, PLAYER_D = 0.75;
const GRAV = 32, JUMP_V = 14, MOVE_SPEED = 9, MAX_FALL = 25;

function getPlayerBox(){
  return {
    x: player.pos.x - PLAYER_W/2,
    y: player.pos.y,
    z: player.pos.z - PLAYER_D/2,
    w: PLAYER_W, h: PLAYER_H, d: PLAYER_D
  };
}

function aabbOverlap(a, b){
  return a.x < b.x+b.w && a.x+a.w > b.x &&
         a.y < b.y+b.h && a.y+a.h > b.y &&
         a.z < b.z+b.d && a.z+a.d > b.z;
}

function resolveAxis(axis){
  const p = getPlayerBox();
  for (const b of boxes){
    if (!aabbOverlap(p, b)) continue;
    if (axis === 'y'){
      const pushUp = (b.y + b.h) - p.y;
      const pushDown = (p.y + p.h) - b.y;
      if (pushUp < pushDown){
        player.pos.y += pushUp;
        if (player.vel.y < 0) player.vel.y = 0;
        player.onGround = true;
      } else {
        player.pos.y -= pushDown;
        if (player.vel.y > 0) player.vel.y = 0;
      }
    } else if (axis === 'x'){
      const pushL = (p.x + p.w) - b.x;
      const pushR = (b.x + b.w) - p.x;
      if (pushL < pushR){
        player.pos.x -= pushL;
        if (player.vel.x > 0) player.vel.x = 0;
      } else {
        player.pos.x += pushR;
        if (player.vel.x < 0) player.vel.x = 0;
      }
    } else {
      const pushF = (p.z + p.d) - b.z;
      const pushB = (b.z + b.d) - p.z;
      if (pushF < pushB){
        player.pos.z -= pushF;
        if (player.vel.z > 0) player.vel.z = 0;
      } else {
        player.pos.z += pushB;
        if (player.vel.z < 0) player.vel.z = 0;
      }
    }
    p.x = player.pos.x - PLAYER_W/2;
    p.y = player.pos.y;
    p.z = player.pos.z - PLAYER_D/2;
  }
}

// joystick
const stick = document.getElementById('stick');
const knob = document.getElementById('knob');
let stickId = null;
let stickStart = {x:0, y:0};
function stickMove(e){
  const t = [...e.touches].find(t => t.identifier === stickId);
  if (!t) return;
  const rect = stick.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;
  let dx = t.clientX - cx, dy = t.clientY - cy;
  const dist = Math.hypot(dx, dy);
  const maxR = rect.width/2 - 30;
  if (dist > maxR){ dx = dx/dist*maxR; dy = dy/dist*maxR; }
  knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  const nx = dx/maxR, ny = dy/maxR;
  touch.left = nx < -0.25;
  touch.right = nx > 0.25;
  touch.up = ny < -0.25;
  touch.down = ny > 0.25;
}
stick.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  stickId = t.identifier;
  stickMove(e);
});
stick.addEventListener('touchmove', e => { e.preventDefault(); stickMove(e); });
stick.addEventListener('touchend', e => {
  e.preventDefault();
  if ([...e.changedTouches].some(t => t.identifier === stickId)) stickId = null;
  knob.style.transform = 'translate(-50%,-50%)';
  touch.left = touch.right = touch.up = touch.down = false;
});

/* ============ ENEMY AI ============ */
function updateEnemies(dt){
  for (const e of enemies){
    if (!e.userData.alive) continue;
    const u = e.userData;
    u.t += dt * u.speed;
    const k = (Math.sin(u.t * Math.PI * 2) + 1) / 2;
    e.position.lerpVectors(u.a, u.b, k);
    // face direction
    const dir = new THREE.Vector3().subVectors(u.b, u.a).normalize();
    e.lookAt(e.position.clone().add(dir));
    e.rotation.y += Math.PI/2;
    // collision with player
    if (player.invuln > 0 || player.dead) continue;
    const dx = e.position.x - player.pos.x;
    const dy = e.position.y - (player.pos.y + PLAYER_H/2);
    const dz = e.position.z - player.pos.z;
    if (dx*dx + dy*dy + dz*dz < 1.1*1.1){
      if (player.vel.y < 0 && player.pos.y + PLAYER_H > e.position.y + 0.3){
        // stomp
        u.alive = false;
        e.visible = false;
        player.vel.y = 11;
        player.score += 50;
        spawnBurst(e.position, 0xffcc00, 16);
        updateHUD();
      } else {
        damagePlayer();
      }
    }
  }
}

function damagePlayer(){
  if (player.invuln > 0 || player.dead) return;
  player.hp--;
  player.invuln = 100;
  updateHUD();
  if (player.hp <= 0){
    player.dead = true;
    player.deathT = 0;
  }
  spawnBurst(player.pos.clone().add(new THREE.Vector3(0, 1, 0)), 0xff3344, 20);
}

/* ============ BOSS ============ */
function updateBoss(dt){
  if (!boss || !boss.userData.alive) return;
  const u = boss.userData;
  u.t += dt;
  u.angle += dt * 0.6;
  boss.position.x = u.cx + Math.cos(u.angle) * u.radius;
  boss.position.z = u.cz + Math.sin(u.angle) * u.radius;
  boss.position.y = 14 + Math.sin(u.t * 1.5) * 0.6;
  boss.lookAt(player.pos.x, player.pos.y + 1, player.pos.z);
  boss.rotation.x = 0; boss.rotation.z = 0;
  
  if (u.hurt > 0) u.hurt -= dt;
  boss.children[0].material.emissiveIntensity = u.hurt > 0 ? 1.5 : 0.4;
  
  // phase 2
  if (u.hp <= u.maxHp/2 && u.phase === 1){ u.phase = 2; u.radius = 8; }
  
  // shoot
  u.shootT -= dt * 60;
  if (u.shootT <= 0){
    u.shootT = u.phase === 1 ? 100 : 60;
    const dir = new THREE.Vector3().subVectors(player.pos, boss.position).normalize();
    const speed = u.phase === 1 ? 9 : 13;
    const pGeo = new THREE.SphereGeometry(0.35, 12, 8);
    const pMat = new THREE.MeshStandardMaterial({color:0xff2200, emissive:0xff4400, emissiveIntensity:2});
    const proj = new THREE.Mesh(pGeo, pMat);
    proj.position.copy(boss.position);
    proj.userData = {
      vel: dir.multiplyScalar(speed),
      life: 4
    };
    proj.castShadow = true;
    world.add(proj);
    u.projectiles.push(proj);
    
    if (u.phase === 2){
      for (let i = -1; i <= 1; i += 2){
        const d2 = dir.clone().applyAxisAngle(new THREE.Vector3(0,1,0), i * 0.3);
        const p2 = new THREE.Mesh(pGeo, pMat);
        p2.position.copy(boss.position);
        p2.userData = { vel: d2.multiplyScalar(speed), life: 4 };
        p2.castShadow = true;
        world.add(p2);
        u.projectiles.push(p2);
      }
    }
  }
  
  // update projectiles
  for (let i = u.projectiles.length - 1; i >= 0; i--){
    const p = u.projectiles[i];
    p.position.addScaledVector(p.userData.vel, dt);
    p.userData.life -= dt;
    if (p.userData.life <= 0){
      world.remove(p);
      u.projectiles.splice(i, 1);
      continue;
    }
    if (player.dead) continue;
    const dx = p.position.x - (player.pos.x);
    const dy = p.position.y - (player.pos.y + PLAYER_H/2);
    const dz = p.position.z - (player.pos.z);
    if (dx*dx + dy*dy + dz*dz < 1.1*1.1){
      damagePlayer();
      world.remove(p);
      u.projectiles.splice(i, 1);
    }
  }
  
  // player collision
  if (!player.dead && player.invuln <= 0){
    const dx = boss.position.x - player.pos.x;
    const dy = boss.position.y - (player.pos.y + PLAYER_H/2);
    const dz = boss.position.z - player.pos.z;
    if (dx*dx + dy*dy + dz*dz < 2.2*2.2){
      if (player.vel.y < 0 && player.pos.y + PLAYER_H > boss.position.y + 0.5){
        u.hp--;
        u.hurt = 0.3;
        player.vel.y = 12;
        player.score += 100;
        spawnBurst(boss.position.clone(), 0xff0000, 20);
        updateHUD();
        if (u.hp <= 0){
          u.alive = false;
          boss.visible = false;
          for (const p of u.projectiles) world.remove(p);
          spawnBurst(boss.position.clone(), 0xffd700, 40);
          player.score += 1000;
          updateHUD();
          setTimeout(() => {
            showScreen('win');
            state = 'win';
          }, 800);
        }
      } else {
        damagePlayer();
      }
    }
  }
}

/* ============ MAIN LOOP ============ */
let lastT = performance.now();
function loop(){
  requestAnimationFrame(loop);
  const now = performance.now();
  let dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  
  if (state === 'play'){
    // input
    let ix = 0, iz = 0;
    if (keys['ArrowLeft'] || keys['KeyA'] || touch.left) ix -= 1;
    if (keys['ArrowRight'] || keys['KeyD'] || touch.right) ix += 1;
    if (keys['ArrowUp'] || keys['KeyW'] || touch.up) iz -= 1;
    if (keys['ArrowDown'] || keys['KeyS'] || touch.down) iz += 1;
    const ilen = Math.hypot(ix, iz);
    if (ilen > 0){ ix /= ilen; iz /= ilen; }
    
    // horizontal
    const targetVx = ix * MOVE_SPEED;
    const targetVz = iz * MOVE_SPEED;
    const acc = player.onGround ? 15 : 8;
    player.vel.x += (targetVx - player.vel.x) * Math.min(1, acc * dt);
    player.vel.z += (targetVz - player.vel.z) * Math.min(1, acc * dt);
    
    // facing
    if (ilen > 0.1){
      const targetFacing = Math.atan2(ix, iz);
      let d = targetFacing - player.facing;
      while (d > Math.PI) d -= Math.PI*2;
      while (d < -Math.PI) d += Math.PI*2;
      player.facing += d * Math.min(1, 12 * dt);
    }
    
    // gravity
    player.vel.y -= GRAV * dt;
    if (player.vel.y < -MAX_FALL) player.vel.y = -MAX_FALL;
    
    // jump
    if (player.coyote > 0) player.coyote -= dt * 60;
    if (player.jumpBuf > 0) player.jumpBuf -= dt * 60;
    
    if (player.jumpBuf > 0 && (player.onGround || player.coyote > 0)){
      player.vel.y = JUMP_V;
      player.onGround = false;
      player.coyote = 0;
      player.jumpBuf = 0;
      player.stretch = 1.35;
      player.doubleJump = true;
    } else if (player.jumpBuf > 0 && player.doubleJump && !player.onGround){
      player.vel.y = JUMP_V * 0.85;
      player.jumpBuf = 0;
      player.doubleJump = false;
      player.stretch = 1.4;
      spawnBurst(player.pos.clone().add(new THREE.Vector3(0,0.5,0)), 0xFFD700, 12);
    }
    
    // move + collide
    player.onGround = false;
    player.pos.x += player.vel.x * dt;
    resolveAxis('x');
    player.pos.z += player.vel.z * dt;
    resolveAxis('z');
    player.pos.y += player.vel.y * dt;
    resolveAxis('y');
    
    if (player.onGround) player.coyote = 8;
    
    // death by fall
    if (player.pos.y < -20 && !player.dead){
      player.dead = true;
      player.deathT = 0;
    }
    
    // dying
    if (player.dead){
      player.deathT += dt;
      if (player.deathT > 1.2){
        showScreen('over');
        state = 'over';
      }
    }
    
    // invuln
    if (player.invuln > 0) player.invuln -= dt * 60;
    
    // update rabbit visual
    rabbit.position.copy(player.pos);
    rabbit.position.y += 0;
    rabbit.rotation.y = player.facing;
    
    // animations
    const ud = rabbit.userData;
    const running = Math.hypot(player.vel.x, player.vel.z) > 1 && player.onGround;
    if (running){
      player.runPhase += dt * 14;
      const rp = player.runPhase;
      ud.feet[0].position.z = 0.14 + Math.sin(rp) * 0.25;
      ud.feet[0].position.y = 0.12 + Math.max(0, Math.sin(rp)) * 0.15;
      ud.feet[1].position.z = 0.14 + Math.sin(rp + Math.PI) * 0.25;
      ud.feet[1].position.y = 0.12 + Math.max(0, Math.sin(rp + Math.PI)) * 0.15;
      ud.arms[0].rotation.x = Math.sin(rp + Math.PI) * 0.6;
      ud.arms[1].rotation.x = Math.sin(rp) * 0.6;
      ud.body.position.y = 0.75 + Math.abs(Math.sin(rp * 2)) * 0.05;
    } else {
      ud.feet[0].position.z = 0.14; ud.feet[0].position.y = 0.12;
      ud.feet[1].position.z = 0.14; ud.feet[1].position.y = 0.12;
      ud.arms[0].rotation.x *= 0.85;
      ud.arms[1].rotation.x *= 0.85;
      ud.body.position.y = 0.75 + Math.sin(performance.now() * 0.002) * 0.02;
    }
    // ears
    const earWiggle = player.onGround ? 0 : Math.sin(performance.now() * 0.008) * 0.25;
    ud.ears[0].rotation.x = earWiggle;
    ud.ears[1].rotation.x = earWiggle;
    
    // squash/stretch
    if (!player.onGround){
      player.stretch += (1 - player.stretch) * dt * 6;
      player.squash += (1 - player.squash) * dt * 6;
    } else {
      player.squash += (1 - player.squash) * dt * 10;
      player.stretch += (1 - player.stretch) * dt * 10;
    }
    rabbit.scale.set(player.squash, player.stretch, player.squash);
    
    // enemies
    updateEnemies(dt);
    updateBoss(dt);
    updateParticles(dt);
    
    // carrots
    for (const c of carrotMeshes){
      if (c.userData.got) continue;
      c.userData.t += dt * 2;
      c.rotation.y += dt * 2;
      c.position.y = c.userData.baseY + Math.sin(c.userData.t) * 0.2;
      const dx = c.position.x - player.pos.x;
      const dy = c.position.y - (player.pos.y + 1);
      const dz = c.position.z - player.pos.z;
      if (dx*dx + dy*dy + dz*dz < 1.4*1.4){
        c.userData.got = true;
        c.visible = false;
        levelCarrots++;
        player.score += 10;
        updateHUD();
        spawnBurst(c.position.clone(), 0xFFA500, 10);
      }
    }
    
    // goal
    if (goalMesh){
      goalMesh.userData.t += dt;
      goalMesh.rotation.y += dt * 1.5;
      goalMesh.position.y = goalMesh.userData.baseY + Math.sin(goalMesh.userData.t * 2) * 0.25;
      const gd = goalMesh.position.distanceTo(player.pos.clone().add(new THREE.Vector3(0,1,0)));
      if (gd < 1.8){
        // level complete
        const bonus = Math.max(0, (carrotsMax - levelCarrots) * 0 + 100);
        player.score += bonus;
        document.getElementById('compTitle').textContent = '🎉 مرحله ' + (currentLevel+1) + ' تمام شد!';
        document.getElementById('compText').textContent =
          `هویج‌ها: ${levelCarrots}/${carrotsMax}   |   امتیاز: ${player.score}`;
        showScreen('complete');
        state = 'complete';
      }
    }
    
    // sun follows
    sun.position.set(player.pos.x + 20, 35, player.pos.z + 15);
    sun.target.position.set(player.pos.x, 0, player.pos.z);
    sun.target.updateMatrixWorld();
    
    // sky follows
    camera.updateMatrixWorld();
    
    updateCamera(dt);
  }
  
  // menu idle camera
  if (state === 'menu'){
    const t = performance.now() * 0.0005;
    camera.position.set(Math.cos(t) * 12, 6, Math.sin(t) * 12);
    camera.lookAt(0, 2, 0);
    if (!world.children.length) buildLevel(0);
    rabbit.position.set(0, 1, 0);
    rabbit.rotation.y = Math.sin(t * 3) * 0.3;
  }
  
  // clouds drift
  for (const c of clouds){
    c.position.x += dt * 0.5;
    if (c.position.x > 120) c.position.x = -120;
  }
  
  renderer.render(scene, camera);
}
loop();
</script>
</body>
</html>
